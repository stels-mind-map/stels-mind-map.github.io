<style>
:root{
  --bg:#F4F2EE;--surface:#FFFFFF;--ink:#1B1F24;--muted:#5E6670;--line:#D6D2CB;
  --c1:#1F6FD1;--c2:#0E7C6B;--c3:#5B7A12;--c4:#C2410C;--c5:#7C3AED;
  --c6:#B91C1C;--c7:#A21CAF;--c8:#B45309;--c9:#475569;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121417;--surface:#1B1F24;--ink:#EDEFF2;--muted:#9AA3AD;--line:#323941;
  --c1:#6AA6F2;--c2:#3CC4AE;--c3:#A3C94A;--c4:#F28A55;--c5:#A98AF7;
  --c6:#F27272;--c7:#E07BE8;--c8:#E8A94E;--c9:#94A3B8;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14.5px;line-height:1.45}
.page{max-width:1280px;margin:0 auto;padding:28px 18px 60px}

/* tree */
.mapwrap{overflow-x:auto;padding-bottom:10px}
.branch{display:flex;align-items:center;position:relative}
.kids{display:flex;flex-direction:column;position:relative;padding-left:26px}
.kids::before{content:"";position:absolute;left:0;top:50%;width:26px;border-top:2px solid var(--c)}
.kids>.branch{padding-left:20px;padding-block:5px}
.kids>.branch::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:2px solid var(--c)}
.kids>.branch:first-child::before{top:50%}
.kids>.branch:last-child::before{bottom:50%}
.kids>.branch:only-child::before{display:none}
.kids>.branch::after{content:"";position:absolute;left:0;top:50%;width:20px;border-top:2px solid var(--c)}
.collapsed>.kids{display:none}
.collapsed>.node .arrow{transform:rotate(0deg)}

.node{flex:none;cursor:pointer;user-select:none}
.arrow{display:inline-block;transition:transform .15s;transform:rotate(90deg);font-weight:800}
.root{background:var(--ink);color:var(--bg);border-radius:16px;padding:16px 18px;width:210px;font-weight:800;font-size:16px;line-height:1.25;cursor:default}
.root small{display:block;font-weight:500;font-size:12.5px;opacity:.75;margin-top:6px}
.item{background:var(--surface);border:2px solid var(--c);border-radius:14px;padding:11px 12px;width:270px;display:flex;gap:10px;align-items:flex-start}
.item .num{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--c);color:var(--surface);font-weight:800}
.item .t{font-weight:800;font-size:15px;line-height:1.25}
.item .s{color:var(--muted);font-size:12.5px;margin-top:3px}
.item .arrow{margin-left:auto;color:var(--c)}
.group{background:var(--c);color:var(--surface);border-radius:9px;padding:5px 11px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;width:136px;display:flex;justify-content:space-between;gap:6px}
.leaf{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:8px 12px;width:440px;max-width:440px}
.leaf.q{font-weight:600}
.leaf .who{color:var(--c);font-weight:800}

@media (max-width:860px){
  .branch{flex-direction:column;align-items:stretch}
  .kids{padding-left:16px;margin-left:12px;border-left:2px solid var(--c)}
  .kids::before,.kids>.branch::before,.kids>.branch::after{display:none}
  .kids>.branch{padding-left:0}
  .root,.item,.group,.leaf{width:auto;max-width:none}
  .group{display:inline-flex;align-self:flex-start;min-width:150px;margin-top:6px}
  .root{margin-bottom:6px}
  .mapwrap{overflow:visible}
}
</style>
</head>

<div class="page">
  <div class="mapwrap"><div id="map"></div></div>
</div>

function el(tag, cls, html){var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e;}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function fmtQ(s){var i=s.indexOf(":"); return i>0 ? '<span class="who">'+esc(s.slice(0,i+1))+'</span>'+esc(s.slice(i+1)) : esc(s);}

var map=document.getElementById("map");
var rootBranch=el("div","branch"); rootBranch.style.setProperty("--c","var(--muted)");
rootBranch.appendChild(el("div","node root","Совет директоров Stels<small>Начальник отдела рекламы и PR</small>"));
var rootKids=el("div","kids"); rootBranch.appendChild(rootKids); map.appendChild(rootBranch);

var GROUPS=[["role","Моя роль"],["tasks","Задачи"],["steps","Шаги"],["q","Вопросы"]];
DATA.forEach(function(d){
  var b=el("div","branch"); b.id="item-"+d.n; b.style.setProperty("--c","var(--c"+d.n+")");
  b.appendChild(el("div","node item",'<span class="num">'+d.n+'</span><div><div class="t">'+esc(d.title)+'</div><div class="s">'+esc(d.sub)+'</div></div><span class="arrow">&#8250;</span>'));
  var kids=el("div","kids");
  GROUPS.forEach(function(g){
    var gb=el("div","branch");
    gb.appendChild(el("div","node group",'<span>'+g[1]+'</span><span>'+d[g[0]].length+' <span class="arrow">&#8250;</span></span>'));
    var gk=el("div","kids");
    d[g[0]].forEach(function(t){var lb=el("div","branch"); lb.appendChild(el("div","leaf"+(g[0]=="q"?" q":""), g[0]=="q"?fmtQ(t):esc(t))); gk.appendChild(lb);});
    gb.appendChild(gk); kids.appendChild(gb);
  });
  b.appendChild(kids); rootKids.appendChild(b);
});

map.addEventListener("click",function(e){
  var n=e.target.closest(".node"); if(!n||n.classList.contains("root")) return;
  n.parentElement.classList.toggle("collapsed");
});
</script>
